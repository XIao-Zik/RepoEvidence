name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # The offline gate never calls a provider. These values only satisfy Compose interpolation.
      REPO_EVIDENCE_MODEL_API_KEY: ci-not-used
      REPO_EVIDENCE_ALLOWED_ROOT_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test images
        run: docker compose build backend frontend
      - name: Run shared quality gate
        run: make ci
