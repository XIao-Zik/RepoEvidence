# RepoEvidence 的本地服务连接。允许根目录由 REPO_EVIDENCE_ALLOWED_ROOTS 配置。
data_dir = "../../var/live"
host = "127.0.0.1"
port = 8000

# 聊天模型。任何 OpenAI 兼容服务都可以，地址、模型名和密钥都能在 .env 里覆盖：
# REPO_EVIDENCE_MODEL_BASE_URL、REPO_EVIDENCE_MODEL_NAME、REPO_EVIDENCE_MODEL_API_KEY。
[model]
provider = "openai-compatible"
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "REPO_EVIDENCE_MODEL_API_KEY"
timeout_seconds = 60

[model.request_options]
max_tokens = 4096
thinking = { type = "disabled" }

# 本地嵌入模型；revision 固定本次下载的 digest。
[embedding]
provider = "openai-compatible"
name = "qwen3-embedding:0.6b"
base_url = "http://127.0.0.1:11434/v1"
dimensions = 1024
api_key_env = "OLLAMA_API_KEY"
revision = "ac6da0dfba84a81fdbfbaf330198c33cd77c4cdfc53e8bc50eb581914a15621d"
batch_size = 8
timeout_seconds = 600
