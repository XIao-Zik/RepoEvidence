name: repo-evidence

# 仅把明确授权的宿主机代码根目录以只读方式挂载到后端。

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: repo_evidence_admin
      POSTGRES_PASSWORD: ${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}
      POSTGRES_DB: repo_evidence_knowledge
    ports:
      - "127.0.0.1:${REPO_EVIDENCE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - repo_evidence_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_evidence_admin -d repo_evidence_knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20

  database-init:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REPO_EVIDENCE_KNOWLEDGE_ADMIN_DSN: postgresql://repo_evidence_admin:${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}@postgres:5432/repo_evidence_knowledge
      REPO_EVIDENCE_DB_PASSWORD: ${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts:ro
    command: ["python", "/app/scripts/database.py", "setup"]

  backend:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      REPO_EVIDENCE_CONFIG: /app/backend/configs/local.toml
      REPO_EVIDENCE_HOST: 0.0.0.0
      REPO_EVIDENCE_DATA_DIR: /app/var/live
      REPO_EVIDENCE_ALLOWED_ROOTS: '[{"id":"workspace","path":"/workspace"}]'
      # 默认用下面 compose 起的 Ollama 服务；换成远端服务时在 .env 里覆盖这一项。
      REPO_EVIDENCE_EMBEDDING_BASE_URL: ${REPO_EVIDENCE_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      # 聊天模型三项：密钥必填，地址与模型名留空时用 local.toml 里的默认值。
      REPO_EVIDENCE_MODEL_API_KEY: ${REPO_EVIDENCE_MODEL_API_KEY:?Set REPO_EVIDENCE_MODEL_API_KEY in .env}
      REPO_EVIDENCE_MODEL_BASE_URL: ${REPO_EVIDENCE_MODEL_BASE_URL:-}
      REPO_EVIDENCE_MODEL_NAME: ${REPO_EVIDENCE_MODEL_NAME:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      REPO_EVIDENCE_KNOWLEDGE_DSN: postgresql://repo_evidence_knowledge_reader:${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}@postgres:5432/repo_evidence_knowledge
      REPO_EVIDENCE_KNOWLEDGE_BUILDER_DSN: postgresql://repo_evidence_knowledge_builder:${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}@postgres:5432/repo_evidence_knowledge
      REPO_EVIDENCE_KNOWLEDGE_ADMIN_DSN: postgresql://repo_evidence_admin:${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}@postgres:5432/repo_evidence_knowledge
      REPO_EVIDENCE_DB_PASSWORD: ${REPO_EVIDENCE_DB_PASSWORD:-repo_evidence_local}
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./var:/app/var
      - ${REPO_EVIDENCE_ALLOWED_ROOT_PATH:?Set REPO_EVIDENCE_ALLOWED_ROOT_PATH in .env}:/workspace:ro
    ports:
      - "127.0.0.1:${REPO_EVIDENCE_BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
    depends_on:
      - backend
    environment:
      REPO_EVIDENCE_API_PROXY: http://backend:8000
      REPO_EVIDENCE_POLL_WATCH: "1"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/frontend/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/frontend/tsconfig.node.json
    ports:
      - "127.0.0.1:${REPO_EVIDENCE_FRONTEND_PORT:-5173}:5173"

  # 嵌入服务：索引代码片段及用户问题时均使用同一个模型。
  # 不对外发布 11434，避免和宿主机已经装着的 Ollama 抢端口；后端走服务网络访问。
  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - repo_evidence_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 首次启动把嵌入模型拉进 repo_evidence_ollama 卷；已有模型则直接退出。
  # 模型标签由 backend/configs/local.toml 的 embedding.name 决定，改那里也要改这里。
  # OLLAMA_HOST 让 CLI 作为客户端连上面那个服务，所以这里不挂模型卷、也不起 server。
  ollama-init:
    image: ollama/ollama:0.12.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama list | grep -q '^qwen3-embedding:0.6b'; then
          echo "embedding model already present, skipping"
        else
          ollama pull qwen3-embedding:0.6b
        fi

volumes:
  repo_evidence_postgres:
  repo_evidence_ollama:
